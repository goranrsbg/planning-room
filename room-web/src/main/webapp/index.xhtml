<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/layout/def_template.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{welcome.init()}"/>
        </f:metadata>
    </ui:define>
    <ui:define name="pageTitle">#{welcome.title}</ui:define>
     <ui:define name="headIncludes">
        <link rel="stylesheet" type="text/css" href="app.css" />    
    </ui:define>
    <ui:define name="content">
        <planning-room version="#{welcome.version}"></planning-room>
    </ui:define>
    <ui:define name="bodyIncludes">
        <script type="module" src="app.bundle.js"/>    
    </ui:define>
</ui:composition>
